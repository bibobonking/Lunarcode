name: Lunarcode Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (vd: v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Tạo draft release (nháp) để kiểm tra trước?'
        required: false
        default: true
        type: boolean
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload web build (dist)
        if: matrix.label == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: lunarcode-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Install RPM and Arch packaging tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Build installers
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: lunarcode-desktop-${{ matrix.label }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.pacman
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Chỉ tải artifact desktop, KHÔNG tải web dist
      - uses: actions/download-artifact@v4
        with:
          path: dist-desktop
          pattern: lunarcode-desktop-*
          merge-multiple: true

      - name: Show files to release
        run: ls -lh dist-desktop/

      # Xác định tag: từ input (workflow_dispatch) hoặc từ ref (push tag)
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          files: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.rpm
            dist-desktop/*.pacman
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
