name: CreateCode Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create a draft release to review first?'
        required: false
        default: true
        type: boolean
  push:
    tags: ['v*']

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

# One run per ref. Never cancel a running release halfway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves the release tag once (from the input or from the pushed tag) for every later job.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Determine tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Values go through env vars, never straight into the script, so they cannot inject shell code.
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$INPUT_VERSION"; else tag="$REF_NAME"; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]*)?$'; then
            echo "Invalid tag '$tag' (expected something like v1.2.3)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.label }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Installer names and the in-app version come from package.json, so both files must match the tag.
      - name: Check that the tag matches the app version
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for file in package.json desktop/package.json; do
            found="$(node -p "require('./$file').version")"
            if [ "$found" != "$VERSION" ]; then
              echo "$file has version $found, but the tag says $VERSION" >&2
              exit 1
            fi
          done

      - name: Build the app (dist)
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # rpm is needed by electron-builder for the .rpm target. Arch packages are built in the `arch` job.
      - name: Install RPM tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Linux: AppImage, deb and rpm, plus the unpacked app (`dir`) that the Arch package is built from.
      - name: Build installers (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npm run dist -- --linux AppImage deb rpm dir --publish never

      - name: Build installers (Windows / macOS)
        if: runner.os != 'Linux'
        working-directory: desktop
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Artifacts do not keep file modes (executables, the setuid chrome-sandbox), so ship the unpacked app as a tarball.
      - name: Archive the unpacked Linux app
        if: runner.os == 'Linux'
        run: tar -C desktop/release -czf linux-unpacked.tar.gz linux-unpacked

      - name: Upload unpacked Linux app
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: createcode-linux-unpacked
          path: linux-unpacked.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: createcode-desktop-${{ matrix.label }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.rpm
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Builds a real Arch package (name-version-rel-arch.pkg.tar.zst) with makepkg inside an Arch container,
  # instead of electron-builder's `.pacman` output.
  arch:
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm git zstd

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: createcode-linux-unpacked
          path: arch-input

      - name: Prepare the PKGBUILD
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          work=/home/builder/pkg
          useradd -m builder
          mkdir -p "$work"
          tar -xzf arch-input/linux-unpacked.tar.gz -C "$work"
          cp desktop/build/icon.png "$work/icon.png"
          cp LICENSE "$work/LICENSE"

          # Must match linux.executableName in desktop/electron-builder.yml.
          if [ ! -f "$work/linux-unpacked/createcode" ]; then
            echo "Could not find the app executable 'createcode' in linux-unpacked:" >&2
            ls -la "$work/linux-unpacked" >&2
            exit 1
          fi

          cat > "$work/createcode.desktop" <<'EOF'
          [Desktop Entry]
          Name=CreateCode
          Comment=Local AI coding agent
          Exec=createcode %U
          Icon=createcode
          Terminal=false
          Type=Application
          Categories=Development;
          StartupWMClass=createcode
          EOF

          cat > "$work/PKGBUILD" <<'EOF'
          pkgname=createcode
          pkgver=@PKGVER@
          pkgrel=1
          pkgdesc='CreateCode local AI coding agent (desktop)'
          arch=('x86_64')
          url='https://github.com/bibobonking/CreateCode'
          license=('MIT')
          depends=('gtk3' 'nss' 'alsa-lib' 'libxss' 'libxtst' 'libnotify' 'at-spi2-core' 'xdg-utils')
          options=('!strip' '!debug')

          package() {
            install -d "$pkgdir/opt/CreateCode" "$pkgdir/usr/bin"
            cp -a "$startdir/linux-unpacked/." "$pkgdir/opt/CreateCode/"
            [ -f "$pkgdir/opt/CreateCode/chrome-sandbox" ] && chmod 4755 "$pkgdir/opt/CreateCode/chrome-sandbox"
            [ -f "$pkgdir/opt/CreateCode/resources/app/bin/createcode" ] && chmod 755 "$pkgdir/opt/CreateCode/resources/app/bin/createcode"
            ln -s /opt/CreateCode/createcode "$pkgdir/usr/bin/createcode"
            ln -s /opt/CreateCode/resources/app/bin/createcode "$pkgdir/usr/bin/createcode-cli"
            install -Dm644 "$startdir/createcode.desktop" "$pkgdir/usr/share/applications/createcode.desktop"
            install -Dm644 "$startdir/icon.png" "$pkgdir/usr/share/icons/hicolor/512x512/apps/createcode.png"
            install -Dm644 "$startdir/LICENSE" "$pkgdir/usr/share/licenses/createcode/LICENSE"
          }
          EOF

          # pkgver cannot contain '-', so 1.2.3-beta.1 becomes 1.2.3_beta.1
          sed -i "s/@PKGVER@/${VERSION//-/_}/" "$work/PKGBUILD"
          chown -R builder:builder "$work"

      - name: Build and verify the package
        run: |
          set -euo pipefail
          su builder -c 'cd /home/builder/pkg && PKGEXT=.pkg.tar.zst makepkg -f --nodeps --nocheck --noconfirm'
          mkdir -p out
          cp /home/builder/pkg/*.pkg.tar.zst out/
          for file in out/*.pkg.tar.zst; do
            echo "== $file"
            pacman -Qip "$file"
            bsdtar -tf "$file" | head -n 20
            bsdtar -tf "$file" | grep -qx '.PKGINFO'
          done

      - uses: actions/upload-artifact@v7
        with:
          name: createcode-desktop-arch-x64
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: [meta, build, arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only the desktop installers; the unpacked Linux tarball has a different artifact name.
      - uses: actions/download-artifact@v8
        with:
          path: dist-desktop
          pattern: createcode-desktop-*
          merge-multiple: true

      - name: Show files to release
        run: ls -lh dist-desktop/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          files: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.rpm
            dist-desktop/*.pkg.tar.zst
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
