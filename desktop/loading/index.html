<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenSol</title>
<style>
  :root { color-scheme: light dark; --bg:#f8f8f6; --ink:#171715; --muted:#62625d; --accent:#d97706; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f0e; --ink:#edede9; --muted:#a0a099; --accent:#f59e0b; } }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:grid;place-items:center}
  .box{text-align:center}
  .logo{position:relative;width:176px;height:176px;margin:0 auto -6px}
  .glow{position:absolute;inset:0;margin:auto;width:150px;height:150px;border-radius:50%;background:var(--accent);opacity:.13;filter:blur(42px)}
  .shock{position:absolute;inset:0;margin:auto;width:104px;height:104px;border-radius:28%;border:2px solid var(--accent);opacity:0;animation:shock 1.3s cubic-bezier(.16,1,.3,1) forwards}
  svg{position:absolute;inset:0;margin:auto;overflow:visible;filter:drop-shadow(0 14px 30px rgba(242,107,33,.38));animation:float 3.2s ease-in-out 2s infinite}
  .tile{transform-origin:32px 32px;animation:pop .55s cubic-bezier(.34,1.56,.64,1) .05s both}
  .ring{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.65,0,.35,1) .2s forwards}
  .chev{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s cubic-bezier(.16,1,.3,1) .75s forwards}
  .under{opacity:.6;transform-origin:40px 39px;animation:under .4s cubic-bezier(.34,1.56,.64,1) 1.05s both}
  .sun{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.9,.5,1) .9s both}
  h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1}
  h1 span{display:inline-block;opacity:0;animation:rise .7s cubic-bezier(.16,1,.3,1) forwards}
  h1 .a{color:var(--accent)}
  p{margin:12px auto 0;color:var(--muted);max-width:360px;line-height:1.5;opacity:0;animation:fade .6s ease 1.6s forwards}
  .err{color:#cf3830;white-space:pre-wrap}
  .stopped svg{animation:none}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes under{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes shock{0%{transform:scale(.8);opacity:.85}100%{transform:scale(2.6);opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  @keyframes fade{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="logo">
      <div class="glow"></div>
      <span class="shock" style="animation-delay:1s"></span>
      <span class="shock" style="animation-delay:1.25s"></span>
      <svg viewBox="0 0 64 64" width="104" height="104" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#26211b"/><stop offset="1" stop-color="#0f0d0b"/></linearGradient>
          <linearGradient id="rg" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#f26b21"/></linearGradient>
          <radialGradient id="sn" cx="46" cy="18" r="6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff2b8"/><stop offset="1" stop-color="#ffc233"/></radialGradient>
        </defs>
        <g class="tile"><rect width="64" height="64" rx="15" fill="url(#bg)"/><rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" stroke="#fff" stroke-opacity=".09" stroke-width="1.5"/></g>
        <path class="ring" d="M51.32 26.82A20 20 0 1 1 37.18 12.68" stroke="url(#rg)" stroke-width="5.6" stroke-linecap="round" pathLength="1"/>
        <circle class="sun" cx="46.14" cy="17.86" r="5" fill="url(#sn)"/>
        <g stroke="#fff4e0" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="chev" d="M25.2 25.6L34 32l-8.8 6.4" pathLength="1"/>
          <path class="under" d="M37.6 39.2h6"/>
        </g>
      </svg>
    </div>
    <h1 aria-label="OpenSol" id="word"></h1>
    <p id="msg">Starting the local daemon…</p>
  </div>
<script>
  (function () {
    var w = document.getElementById('word');
    'OpenSol'.split('').forEach(function (c, i) {
      var s = document.createElement('span');
      s.textContent = c;
      s.style.animationDelay = (1.15 + i * 0.055) + 's';
      if (i >= 4) s.className = 'a';
      w.appendChild(s);
    });
  })();
  window.__opensolError = function (message) {
    document.getElementById('box').className = 'box stopped';
    var el = document.getElementById('msg');
    el.className = 'err';
    el.style.animation = 'none';
    el.style.opacity = '1';
    el.textContent = message;
  };
</script>
</body>
</html>
