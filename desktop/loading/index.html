<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CreateCode</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f8; --ink:#303038; --muted:#646471; --track:#e5e5eb; --accent:#3478d6; --danger:#be2834; }
  @media (prefers-color-scheme: dark) { :root { --bg:#222226; --ink:#eeeef2; --muted:#b6b6c1; --track:#3c3c43; --accent:#3e86e0; --danger:#ff9692; } }
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px "Adwaita Sans",Inter,Cantarell,system-ui,sans-serif}
  body{display:grid;place-items:center}
  .box{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
  svg{animation:in .5s cubic-bezier(.16,1,.3,1) both}
  .gear{transform-origin:46.14px 17.86px;animation:turn 4s linear infinite}
  h1{margin:24px 0 0;font-size:24px;font-weight:800;line-height:1}
  .by{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
  .bar{position:relative;overflow:hidden;width:176px;height:6px;margin-top:40px;border-radius:999px;background:var(--track)}
  .bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:999px;background:var(--accent);animation:sweep 1.4s cubic-bezier(.65,0,.35,1) infinite}
  #msg{margin:14px 0 0;max-width:360px;font-size:12px;line-height:1.5;color:var(--muted)}
  #msg.err{color:var(--danger);white-space:pre-wrap}
  .stopped .gear{animation:none}
  .stopped .bar{display:none}
  @keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes turn{to{transform:rotate(360deg)}}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  @media (prefers-reduced-motion: reduce){*,*::after{animation:none!important}}
</style>
</head>
<body>
  <div class="box" id="box">
    <svg viewBox="0 0 64 64" width="96" height="96" fill="none" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#0f0f11"/><rect width="64" height="61" rx="16" fill="#2e2e33"/>
      <g transform="translate(0 -1.5)">
        <path d="M51.32 26.82A20 20 0 1 1 37.18 12.68" stroke="#fff" stroke-width="5.6" stroke-linecap="round"/>
        <path class="gear" d="M44.57 13.43L44.93 11.58L47.35 11.58L47.71 13.43L48.16 13.62L49.73 12.56L51.44 14.27L50.38 15.84L50.57 16.29L52.42 16.65L52.42 19.07L50.57 19.43L50.38 19.88L51.44 21.45L49.73 23.16L48.16 22.10L47.71 22.29L47.35 24.14L44.93 24.14L44.57 22.29L44.12 22.10L42.55 23.16L40.84 21.45L41.90 19.88L41.71 19.43L39.86 19.07L39.86 16.65L41.71 16.29L41.90 15.84L40.84 14.27L42.55 12.56L44.12 13.62ZM43.94 17.86a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0Z" fill="#fff" fill-rule="evenodd" stroke="#fff" stroke-width=".7" stroke-linejoin="round"/>
        <g stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><path d="M25.2 25.6L34 32l-8.8 6.4"/><path d="M37.6 39.2h6" opacity=".55"/></g>
      </g>
    </svg>
    <h1>CreateCode</h1>
    <p class="by">by Bibobonking</p>
    <div class="bar"></div>
    <p id="msg">Starting the local daemon…</p>
  </div>
<script>
  window.__createcodeError = function (message) {
    document.getElementById('box').className = 'box stopped';
    var el = document.getElementById('msg');
    el.className = 'err';
    el.textContent = message;
  };
</script>
</body>
</html>
