<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f8" />
    <meta
      name="description"
      content="CreateCode by Bibobonking is a local-first coding agent. Work in a real folder, run commands, edit files and deploy with your own model keys. Keys stay encrypted on your machine."
    />
    <title>CreateCode — Local coding agent by Bibobonking</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const stored = localStorage.getItem('createcode.theme')
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        const root = document.documentElement
        if (localStorage.getItem('createcode.style') === 'glass') root.dataset.style = 'glass'
        root.dataset.theme = theme
        if (theme === 'dark') root.classList.add('dark')
      } catch {}
    </script>
    <script type="module" crossorigin src="./assets/index-COcaCLrR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BsS4ZO-M.css">
  </head>
  <body>
    <div id="root"><div class="splash" id="boot-splash" aria-hidden="true">
      <style>
        .splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgb(var(--panel))}
      </style>
      <!-- Intentionally empty: src/components/Splash.tsx draws the start screen once React mounts. -->
    </div></div>
  </body>
</html>
